<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My GitHub Pages Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 800px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #667eea;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 40px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }
        
        .feature {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .feature h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .feature p {
            font-size: 0.95em;
            color: #666;
        }
        
        .cta {
            margin-top: 40px;
        }
        
        .cta a {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
            margin: 0 10px;
        }
        
        .cta a:hover {
            background: #764ba2;
        }
        
        .footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Welcome!</h1>
        <p class="subtitle">Your GitHub Pages site is live and ready to go</p>
        
        <div class="features">
            <div class="feature">
                <h3>📝 Easy to Edit</h3>
                <p>Update your content directly on GitHub</p>
            </div>
            <div class="feature">
                <h3>⚡ Fast & Free</h3>
                <p>Hosted on GitHub with zero cost</p>
            </div>
            <div class="feature">
                <h3>🎨 Customizable</h3>
                <p>Add your own design and branding</p>
            </div>
        </div>
        
        <div class="cta">
            <a href="https://github.com/nlkolay/github-pages-demo">View on GitHub</a>
            <a href="pages.html">Learn More</a>
        </div>
        
        <div class="footer">
            <p>Built with GitHub Pages | © 2024</p>
        </div>
    </div>
</body>
</html>
